plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
}

version = '1.0'
group = 'com.example.users'

repositories { mavenCentral() }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

ext {
    springdocVersion  = '3.1.1'   // not managed by the Spring Boot BOM
}

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:4.1.1")

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // Spring Boot 4 moved auto-configuration into per-technology modules: bare
    // flyway-core on the classpath no longer triggers it, so the starter is required.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation 'io.micrometer:micrometer-registry-prometheus'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'net.logstash.logback:logstash-logback-encoder:8.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Testcontainers 2.x renamed every module with a `testcontainers-` prefix and
    // moved the packages (org.testcontainers.postgresql). The old coordinates stop
    // at 1.21.4, so the names the Spring Boot BOM manages at 2.0.5 are these.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}
