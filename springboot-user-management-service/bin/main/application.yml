spring:
  application:
    name: springboot-user-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/usersdb}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Entity/schema drift fails at startup, never silently at runtime.
      ddl-auto: validate
    # Spring Boot defaults this to true, which holds the persistence context open
    # through response rendering and hides lazy-loading bugs. Off, deliberately.
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    # Nothing to migrate: Micronaut owns the user schema, and the feature schema
    # belongs to the feature service's own database.
    enabled: false

  threads:
    virtual:
      enabled: true

app:
  jwt:
    # No default: a deployment without this must fail to start.
    secret: ${JWT_SIGNATURE_SECRET}
    expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
    issuer: user-service
  cors:
    # Comma-separated. Both browser apps need an entry: the product UI and the
    # feature-toggle-management console are different origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      # TQ-9: serve the endpoints at /health and /prometheus rather than under
      # /actuator, so probes, dashboards and the Postman collection are identical
      # across both backends. The app owns only /api/**, /swagger-ui and
      # /v3/api-docs, so nothing collides at the root.
      base-path: /
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: springboot-user-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.example.users: INFO
    org.hibernate: WARN
    org.springframework: WARN
