<div class="login">
  <mat-card class="login__card">
    @if (submitting()) { <mat-progress-bar mode="indeterminate" /> }
    <mat-card-header>
      <mat-card-title>Feature Toggle Management</mat-card-title>
      <mat-card-subtitle>Administrative access</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" autofocus />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (errorMessage(); as message) {
          <p class="login__error" role="alert">
            <mat-icon>error_outline</mat-icon> {{ message }}
          </p>
        }

        <button matButton="filled" type="submit" [disabled]="form.invalid || submitting()">
          Sign in
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
