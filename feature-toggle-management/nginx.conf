# Docker's embedded DNS. Required because the upstreams below are named through
# variables so nginx re-resolves them: with a literal hostname it resolves once at
# startup and keeps a stale IP after an upstream container restarts, answering 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Proxy rather than CORS (technical spec §5, TQ-2). Keeping the browser
    # same-origin avoids widening allowed origins on the service that issues
    # tokens, which is the last place to be relaxed about origins.
    # Authentication stays with the product backend, which owns auth_user. The
    # feature service validates the resulting token but issues none of its own, so
    # sending /auth here would 404. Same operator, same token, two upstreams.
    location ^~ /api/v1/auth/ {
        set                $product_backend springboot-backend;
        proxy_pass         http://$product_backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  X-Correlation-Id;
    }

    location /api/ {
        set                $feature_service feature-toggle-backend;
        proxy_pass         http://$feature_service:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  X-Correlation-Id;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location = /index.html { add_header Cache-Control "no-store"; }

    location / { try_files $uri $uri/ /index.html; }
}
