spring:
  application:
    name: feature-toggle-backend

  datasource:
    # Its own database. This service is the only writer, so Flyway here owns the
    # whole schema and needs no baseline or shared history table.
    url: ${DATASOURCE_URL:jdbc:postgresql://127.0.0.1:15432/feature-toggle}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The migrated tables arrived by pg_dump, so an existing deployment is baselined
    # at V2; a fresh database runs V1 and V2 from scratch.
    baseline-on-migrate: true
    baseline-version: 0

  threads:
    virtual:
      enabled: true

app:
  jwt:
    # Shared with the product backends: this service validates their tokens and
    # issues none of its own.
    secret: ${JWT_SIGNATURE_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4300,http://localhost:8083}
  feature-admin:
    enabled: ${FEATURE_ADMIN_ENABLED:true}
    protected-features: ${FEATURE_ADMIN_PROTECTED:user-data-access,use-springboot-backend}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.example.featuretoggle: INFO
    org.springframework: WARN
    org.ff4j: INFO
