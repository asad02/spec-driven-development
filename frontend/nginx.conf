# Docker's embedded DNS. Required because the upstream below is chosen at request
# time through a variable, and nginx only resolves variable upstreams at runtime.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- feature-toggle routing -------------------------------------------------
    # Every /api/ request first makes an internal subrequest to springboot-backend,
    # which evaluates the ff4j flag (through OpenFeature) and answers 204 with
    # X-Backend-Host naming the upstream to use. Flipping the flag changes routing
    # on the next request: no reload, no redeploy.
    location = /_backend_route {
        internal;
        proxy_pass              http://springboot-backend:8080/api/v1/features/route;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_method            GET;
        proxy_connect_timeout   2s;
        proxy_read_timeout      2s;
    }

    # The toggle API itself must NOT be routed by the toggle. It lives only on
    # springboot-backend, so routing it through the flag would make the flag
    # one-way: once switched to Micronaut, nothing could switch it back.
    # ^~ takes precedence over the prefix match below.
    location ^~ /api/v1/features {
        proxy_pass         http://springboot-backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  X-Correlation-Id;
        proxy_pass_header  X-Served-By;
    }

    location /api/ {
        auth_request     /_backend_route;
        auth_request_set $backend_host $upstream_http_x_backend_host;

        # If the flag service is unreachable the subrequest fails; rather than take
        # the whole API down, fall through to the incumbent Micronaut service.
        error_page 500 502 503 504 = @api_fallback;

        proxy_pass         http://$backend_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  X-Correlation-Id;
        proxy_pass_header  X-Served-By;
    }

    location @api_fallback {
        proxy_pass         http://backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_pass_header  X-Correlation-Id;
        proxy_pass_header  X-Served-By;
        add_header         X-Backend-Routing "fallback" always;
    }
    # ---------------------------------------------------------------------------

    # Hashed bundles are immutable; index.html must never be cached or clients keep
    # booting a stale build after a deploy.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Angular client-side routing: unknown paths resolve to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
